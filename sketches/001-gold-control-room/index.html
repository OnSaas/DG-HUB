<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DG-HUB · 控制室</title>
  <style>
    :root {
      --bg: #070707;
      --panel: #111;
      --line: #262626;
      --gold: #e8d48b;
      --gold-dim: #8a7a4a;
      --text: #f3eee4;
      --muted: #8a8a8a;
      --bad: #c45c4a;
      --ok: #7dba7a;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .app { min-height: 100dvh; display: flex; flex-direction: column; }
    .top {
      display: flex; align-items: center; gap: 12px;
      height: 52px; padding: 0 16px; padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; background: var(--bg);
    }
    .mark { color: var(--gold); font-weight: 600; letter-spacing: .08em; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold-dim); }
    .dot.on { background: var(--ok); box-shadow: 0 0 0 3px #7dba7a22; }
    .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }
    .estop {
      height: 36px; padding: 0 16px; background: var(--bad); color: #1a0a08; font-weight: 700; letter-spacing: .12em;
      min-width: 72px;
    }
    .body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    .ch {
      padding: 20px 18px 88px; display: flex; flex-direction: column; gap: 14px;
      border-right: 1px solid var(--line);
    }
    .ch:last-child { border-right: 0; }
    .ch h2 { font-size: 13px; font-weight: 600; color: var(--gold); display: flex; justify-content: space-between; }
    .readout { font-size: 56px; font-weight: 500; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
    .readout small { font-size: 16px; color: var(--muted); font-weight: 400; }
    input[type=range] { width: 100%; accent-color: var(--gold); height: 28px; }
    .row { display: flex; gap: 8px; }
    .row button {
      flex: 1; height: 44px; border: 1px solid var(--line); background: var(--panel);
    }
    .row button:active { border-color: var(--gold); color: var(--gold); }
    .wave { font-size: 12px; color: var(--muted); min-height: 16px; }
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
      display: flex; gap: 0; border-top: 1px solid var(--line); background: #0c0c0c;
      padding-bottom: var(--safe-b);
    }
    .dock button {
      flex: 1; height: 56px; font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase;
    }
    .dock button.active { color: var(--gold); box-shadow: inset 0 2px 0 var(--gold); }
    .sheet {
      display: none; position: fixed; inset: 0; z-index: 30; background: #070707ee;
      align-items: flex-end; justify-content: center;
    }
    .sheet.on { display: flex; }
    .card {
      width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line);
      padding: 24px; padding-bottom: calc(24px + var(--safe-b));
    }
    .qr { width: 180px; height: 180px; margin: 16px auto; background: #fff; display: grid; place-items: center; color: #111; font-size: 12px; }
    .hint { font-size: 13px; color: var(--muted); text-align: center; }
    @media (max-width: 640px) {
      .body { grid-template-columns: 1fr; }
      .ch { border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
      .readout { font-size: 44px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <span class="mark">DG-HUB</span>
      <span class="dot" id="dot"></span>
      <span class="meta" id="status">未连接</span>
      <span class="spacer"></span>
      <button class="estop" id="estop">STOP</button>
    </header>
    <div class="body">
      <section class="ch" data-ch="A">
        <h2>A <span class="wave" id="waveA"></span></h2>
        <div class="readout" id="valA">0 <small>/ 100</small></div>
        <input type="range" min="0" max="100" value="0" id="slA" />
        <div class="row">
          <button data-n="-1">−</button>
          <button data-n="1">+</button>
        </div>
      </section>
      <section class="ch" data-ch="B">
        <h2>B <span class="wave" id="waveB"></span></h2>
        <div class="readout" id="valB">0 <small>/ 100</small></div>
        <input type="range" min="0" max="100" value="0" id="slB" />
        <div class="row">
          <button data-n="-1">−</button>
          <button data-n="1">+</button>
        </div>
      </section>
    </div>
    <nav class="dock">
      <button class="active" data-tab="console">控制</button>
      <button data-tab="pair">配对</button>
      <button data-tab="waves">波形</button>
    </nav>
  </div>
  <div class="sheet" id="sheet">
    <div class="card" id="sheetBody"></div>
  </div>
  <script>
    const S = { A: 0, B: 0, paired: false, tab: "console" };
    const $ = (id) => document.getElementById(id);
    function paint() {
      $("valA").innerHTML = S.A + " <small>/ 100</small>";
      $("valB").innerHTML = S.B + " <small>/ 100</small>";
      $("slA").value = S.A; $("slB").value = S.B;
      $("status").textContent = S.paired ? "已配对 · 郊狼 3.0" : "未连接";
      $("dot").classList.toggle("on", S.paired);
    }
    function setCh(ch, v) {
      S[ch] = Math.max(0, Math.min(100, v));
      paint();
    }
    document.querySelectorAll(".ch").forEach((el) => {
      const ch = el.dataset.ch;
      el.querySelector("input").addEventListener("input", (e) => setCh(ch, +e.target.value));
      el.querySelectorAll("[data-n]").forEach((b) => b.addEventListener("click", () => setCh(ch, S[ch] + +b.dataset.n)));
    });
    $("estop").onclick = () => { S.A = 0; S.B = 0; $("waveA").textContent = ""; $("waveB").textContent = ""; paint(); };
    const sheet = $("sheet");
    function openSheet(html) { $("sheetBody").innerHTML = html; sheet.classList.add("on"); }
    sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("on"); };
    document.querySelectorAll(".dock button").forEach((b) => b.onclick = () => {
      document.querySelectorAll(".dock button").forEach((x) => x.classList.toggle("active", x === b));
      const tab = b.dataset.tab;
      if (tab === "pair") openSheet(`<div class="hint">4.0 APP 扫码</div><div class="qr">QR · tid 8f2a</div><button class="estop" style="width:100%;margin-top:8px;background:var(--gold)" id="fakePair">模拟接入</button>`);
      if (tab === "waves") openSheet(`<div class="hint">点一下循环 A</div><div class="row" style="flex-wrap:wrap;margin-top:12px">${["呼吸","潮汐","心跳","脉冲","挤压","气泡"].map(n=>`<button data-w="${n}" style="flex:0 0 30%;height:44px;border:1px solid var(--line)">${n}</button>`).join("")}</div>`);
      if (tab === "console") sheet.classList.remove("on");
      requestAnimationFrame(() => {
        const fp = document.getElementById("fakePair");
        if (fp) fp.onclick = () => { S.paired = true; paint(); sheet.classList.remove("on"); };
        $("sheetBody").querySelectorAll("[data-w]").forEach((w) => w.onclick = () => { $("waveA").textContent = w.dataset.w; sheet.classList.remove("on"); });
      });
    });
    paint();
  </script>
</body>
</html>
